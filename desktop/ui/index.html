<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartCaja</title>
  <style>
    :root {
      --navy: #173A7A;
      --gold: #F4C10E;
      --red: #CE1126;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 30%, #1e4a94 0%, #0f2a5a 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      gap: 22px;
    }
    .brand { font-size: 34px; font-weight: 800; letter-spacing: 0.5px; }
    .brand .accent { color: var(--gold); }
    .sub { color: #c7d3ec; font-size: 14px; max-width: 420px; line-height: 1.5; }
    .bar {
      width: 240px; height: 6px; border-radius: 6px; overflow: hidden;
      background: rgba(255,255,255,0.15);
      position: relative;
    }
    .bar::after {
      content: ""; position: absolute; left: -40%; top: 0; height: 100%; width: 40%;
      background: linear-gradient(90deg, var(--navy), var(--red), var(--gold));
      border-radius: 6px;
      animation: slide 1.2s infinite ease-in-out;
    }
    @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
    .foot { position: absolute; bottom: 18px; color: #9fb2d6; font-size: 11px; }
    .status { color: #9fb2d6; font-size: 12px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="brand">Smart<span class="accent">Caja</span></div>
  <div class="sub">Preparando tu asistente de flujo de caja con IA local…</div>
  <div class="bar"></div>
  <div class="status" id="status">Iniciando servicios…</div>
  <div class="foot">Cámara Colombiana de Comercio Electrónico (CCCE)</div>
  <script>
    // Mensajes rotativos mientras el backend arranca.
    const msgs = [
      'Iniciando servicios…',
      'Verificando el motor de IA (Ollama)…',
      'Cargando el motor financiero…',
      'Casi listo…'
    ];
    let i = 0;
    const el = document.getElementById('status');
    setInterval(() => { i = (i + 1) % msgs.length; el.textContent = msgs[i]; }, 2500);
  </script>
</body>
</html>
